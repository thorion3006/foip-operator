name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
          make helm-lint
          make version-check
          make release-readiness

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code -- go.mod go.sum config/ api/ internal/
          git diff --exit-code -- charts/foip-operator
