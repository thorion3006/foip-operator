# This NetworkPolicy allows ingress traffic
# with Pods running on namespaces labeled with 'metrics: enabled'. Only Pods on those
# namespaces are able to gather data from the metrics endpoint.
# Kubelet health probes reach the manager on the health port straight from the
# node, so that port is opened to all sources; it only serves /healthz and
# /readyz.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: foip-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: foip-operator
  policyTypes:
    - Ingress
  ingress:
    # This allows ingress traffic from any namespace with the label metrics: enabled
    - from:
      - namespaceSelector:
          matchLabels:
            metrics: enabled  # Only from namespaces with this label
      ports:
        - port: 8443
          protocol: TCP
    # Health probes are sent by the kubelet from the node itself, which no
    # namespaceSelector can match; without this rule a policy-enabled cluster
    # would fail the liveness and readiness probes on :8081.
    - from:
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
        - port: 8081
          protocol: TCP
